name: Refine Dashboard rich editor v27

on:
  push:
    branches: [main]
    paths:
      - scripts/refine-dashboard-rich-editor-v27.py
      - .github/workflows/refine-dashboard-rich-editor-v27.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply compact Dashboard Notes patch
        run: python3 scripts/refine-dashboard-rich-editor-v27.py

      - name: Commit generated app changes
        run: |
          if git diff --quiet -- index.html service-worker.js README.md; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js README.md
          git commit -m "Refine Dashboard Notes rich editor layout"
          git push origin main
