name: Fix rich text numbered-list starts v24

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-rich-list-start-v24.py'
      - '.github/workflows/fix-rich-list-start-v24.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply numbered-list start repair
        run: python3 scripts/fix-rich-list-start-v24.py

      - name: Commit generated app changes
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js README.md
          git commit -m "Fix numbered list start and continuation behavior"
          git push origin main
