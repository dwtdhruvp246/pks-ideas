name: Polish rich text toolbars v28

on:
  push:
    branches: [main]
    paths:
      - scripts/polish-rich-toolbar-v28.py
      - .github/workflows/polish-rich-toolbar-v28.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply responsive rich toolbar polish
        run: python3 scripts/polish-rich-toolbar-v28.py

      - name: Commit generated app changes
        run: |
          if git diff --quiet -- index.html service-worker.js README.md; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js README.md
          git commit -m "Polish rich text toolbars for mobile"
          git push origin main
